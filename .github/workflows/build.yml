name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Keep in sync with the openidea-plugin tag in Cargo.toml.
  OPENIDEA_VERSION: v0.1.51

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2

      - name: Install openidea-plugin CLI
        run: |
          curl -fsSL "https://github.com/l0ng-ai/openidea/releases/download/${OPENIDEA_VERSION}/openidea-plugin-linux-x86_64.gz" \
            | gunzip | sudo tee /usr/local/bin/openidea-plugin > /dev/null
          sudo chmod +x /usr/local/bin/openidea-plugin
          openidea-plugin --version

      - name: Test
        run: cargo test

      - name: Build plugin.wasm
        run: openidea-plugin build

      - name: Package .oiplugin
        run: |
          mkdir -p out
          openidea-plugin pack . --out out/community.wakatime.oiplugin
          openidea-plugin check out/community.wakatime.oiplugin
          cp dist/plugin.wasm out/

      - uses: actions/upload-artifact@v4
        with:
          name: openidea-wakatime
          path: out/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
